name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger to produce (and publish) the Windows .exe release.
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- Linux ----
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev cmake ninja-build
      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Development -DINK_WITH_TESTS=ON
      - name: Build
        run: ninja -C build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  # -------------------------------------------------------------- Windows ----
  # NOTE: `windows-latest` now runs Windows Server 2025 with Visual Studio
  # 2026 (18.x) — the "Visual Studio 17 2022" generator no longer exists on
  # that image. See actions/runner-images#14017.
  windows-x64:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 via vcpkg
        run: |
          C:\vcpkg\vcpkg install sdl2:x64-windows
        shell: cmd

      - name: Configure (Release, x64)
        run: >
          cmake -B build -G "Visual Studio 18 2026" -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DINK_SDL2_PREFIX=C:/vcpkg/installed/x64-windows
        shell: cmd

      - name: Build
        run: cmake --build build --config Release
        shell: cmd

      - name: Package exe + assets
        run: |
          $out = "dist\inkbound-windows-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build\Release\inkbound.exe $out
          Copy-Item -Recurse Assets $out
          Copy-Item C:\vcpkg\installed\x64-windows\bin\SDL2.dll $out
          Compress-Archive -Path $out -DestinationPath inkbound-windows-x64.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkbound-windows-x64
          path: inkbound-windows-x64.zip

      # Publish a GitHub release so a ready-to-run .exe is always available
      # (on every push to main, and on manual "Run workflow").
      - name: Create GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          $tag = "windows-build-${{ github.run_number }}"
          gh release create --force $tag `
            --title "Inkbound: The Last Reel - Windows x64 ($tag)" `
            --notes "Build ${{ github.run_number }} - Windows x64. Extract and run inkbound.exe with the Assets folder beside it." `
            inkbound-windows-x64.zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
